# Helm values cho kube-prometheus-stack
# Grafana password được lưu trong K8s Secret (không commit vào Git)
# Tạo secret: kubectl create secret generic grafana-admin-secret -n monitoring \
#   --from-literal=admin-user=admin --from-literal=admin-password=PASS

# ── Grafana ──────────────────────────────────────────────────
grafana:
  admin:
    existingSecret: grafana-admin-secret
    userKey: admin-user
    passwordKey: admin-password

  replicas: 2

  service:
    type: LoadBalancer

  persistence:
    enabled: true
    # CephFS (ReadWriteMany) cho phép nhiều pod cùng mount
    # Dùng thay RBD (ReadWriteOnce) khi replicas > 1
    storageClassName: rook-cephfs
    size: 5Gi
    accessModes:
      - ReadWriteMany

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  defaultDashboardsEnabled: true
  defaultDashboardsTimezone: Asia/Ho_Chi_Minh

  # Download dashboards từ grafana.com khi Grafana khởi động
  # Grafana pod cần có internet access (NAT network OK)
  # Thêm folder để phân loại
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: default
          orgId: 1
          folder: "Kubernetes"
          type: file
          disableDeletion: false
          options:
            path: /var/lib/grafana/dashboards/default
        - name: ceph
          orgId: 1
          folder: "Ceph"
          type: file
          disableDeletion: false
          options:
            path: /var/lib/grafana/dashboards/ceph
        - name: logs
          orgId: 1
          folder: "Logging"
          type: file
          disableDeletion: false
          options:
            path: /var/lib/grafana/dashboards/logs
        - name: gitops
          orgId: 1
          folder: "GitOps"
          type: file
          disableDeletion: false
          options:
            path: /var/lib/grafana/dashboards/gitops

  dashboards:
    # ── Ceph ─────────────────────────────────────────
    # datasource DS_PROMETHEUS map tới Prometheus instance
    ceph:
      ceph-cluster:
        gnetId: 2842
        revision: 17
        datasource: Prometheus
      ceph-osd:
        gnetId: 5336
        revision: 9
        datasource: Prometheus
      ceph-pools:
        gnetId: 5342
        revision: 10
        datasource: Prometheus

    # ── Logging ──────────────────────────────────────
    logs:
      loki-logs:
        gnetId: 13639
        revision: 2
        datasource: Loki

    # ── GitOps ───────────────────────────────────────
    gitops:
      argocd:
        gnetId: 14584
        revision: 1
        datasource: Prometheus

  grafana.ini:
    server:
      root_url: "%(protocol)s://%(domain)s/"
    security:
      allow_embedding: true

  # Sidecar tự động detect ConfigMap có label grafana_datasource=1
  # Cần thiết để Loki datasource được add tự động (06-logging)
  sidecar:
    datasources:
      enabled: true
      label: grafana_datasource
      labelValue: "1"
      searchNamespace: ALL
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL

# ── Prometheus ───────────────────────────────────────────────
prometheus:
  prometheusSpec:
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: rook-ceph-block
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 20Gi

    retention: 15d

    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 2Gi

    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false

# ── Alertmanager ─────────────────────────────────────────────
alertmanager:
  alertmanagerSpec:
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: rook-ceph-block
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 2Gi

    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi

# ── Exporters ────────────────────────────────────────────────
nodeExporter:
  enabled: true

kubeStateMetrics:
  enabled: true

kubeEtcd:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
