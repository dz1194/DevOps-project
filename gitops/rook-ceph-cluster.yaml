apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rook-ceph-cluster
  namespace: argocd
  # KHÔNG dùng finalizer cho Ceph — xóa Application không được xóa CephCluster
  finalizers: []
spec:
  project: default
  source:
    repoURL: https://github.com/dz1194/DevOps-project.git
    targetRevision: HEAD
    path: infrastructure/rook-ceph/cluster
  destination:
    server: https://kubernetes.default.svc
    namespace: rook-ceph
  syncPolicy:
    automated:
      prune: false   # QUAN TRỌNG: không bao giờ tự xóa CephCluster
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
