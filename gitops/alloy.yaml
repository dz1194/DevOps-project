# Grafana Alloy — DaemonSet thu thập logs từ tất cả pods → đẩy vào Loki
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alloy
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://grafana.github.io/helm-charts
      chart: alloy
      targetRevision: ">=0.9.0 <1.0.0"
      helm:
        releaseName: alloy
        valueFiles:
          - $values/infrastructure/alloy/values.yaml
    - repoURL: https://github.com/dz1194/DevOps-project.git
      targetRevision: HEAD
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
